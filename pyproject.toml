[project]
name = "leis-mcp"
version = "0.3.0"
description = "Servidor MCP para buscar e citar a legislação brasileira do repositório ctresb/leis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Patrick Mazulo", email = "pmazulo@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "claude", "legislação", "leis", "brasil", "direito"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
leis-mcp = "leis_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/mazulo/leis-mcp"
Repository = "https://github.com/mazulo/leis-mcp"
Issues = "https://github.com/mazulo/leis-mcp/issues"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: usa conteúdo real do ctresb/leis (rede + índice local)"]
